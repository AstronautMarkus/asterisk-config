[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]

; ============================================================
; FAMILIA REYES
; ============================================================

[familia-reyes]

exten => 3004,1,Dial(PJSIP/carla3004,30)
 same => n,Hangup()

exten => 1404,1,Dial(PJSIP/tiago1404,30)
 same => n,Hangup()

exten => 2406,1,Dial(PJSIP/isaura2406,30)
 same => n,Hangup()

exten => 0301,1,Dial(PJSIP/carlos0301,30)
 same => n,Hangup()

exten => 1603,1,Dial(PJSIP/marcos1603,30)
 same => n,Hangup()


; ============================================================
; IVR FAMILIA REYES - 5000
; ============================================================

exten => 5000,1,Answer()
 same => n,Set(IVR_ATTEMPTS=0)
 same => n,Wait(1)
 same => n,Playback(custom/bienvenida-familia)
 same => n,Goto(ivr-familia,s,1)


; ============================================================
; MENU PRINCIPAL
; ============================================================

[ivr-familia]

exten => s,1,Background(custom/menu-familia)
 same => n,WaitExten(5)


; ============================================================
; OPCIONES DEL IVR
; ============================================================

; 1 - CARLA
exten => 1,1,Dial(PJSIP/carla3004,30,m(cisco))
 same => n,GotoIf($["${DIALSTATUS}"="ANSWER"]?answered)
 same => n,Playback(custom/despedida-familia)
 same => n,Hangup()
 same => n(answered),Hangup()


; 2 - TIAGO
exten => 2,1,Dial(PJSIP/tiago1404,30,m(cisco))
 same => n,GotoIf($["${DIALSTATUS}"="ANSWER"]?answered)
 same => n,Playback(custom/despedida-familia)
 same => n,Hangup()
 same => n(answered),Hangup()


; 3 - ISAURA
exten => 3,1,Dial(PJSIP/isaura2406,30,m(cisco))
 same => n,GotoIf($["${DIALSTATUS}"="ANSWER"]?answered)
 same => n,Playback(custom/despedida-familia)
 same => n,Hangup()
 same => n(answered),Hangup()


; 4 - CARLOS
exten => 4,1,Dial(PJSIP/carlos0301,30,m(cisco))
 same => n,GotoIf($["${DIALSTATUS}"="ANSWER"]?answered)
 same => n,Playback(custom/despedida-familia)
 same => n,Hangup()
 same => n(answered),Hangup()


; 5 - MARCOS
exten => 5,1,Dial(PJSIP/marcos1603,30,m(cisco))
 same => n,GotoIf($["${DIALSTATUS}"="ANSWER"]?answered)
 same => n,Playback(custom/despedida-familia)
 same => n,Hangup()
 same => n(answered),Hangup()


; 9 - REPETIR MENU
exten => 9,1,Goto(ivr-familia,s,1)


; 0 - SALIR
exten => 0,1,Playback(custom/despedida-familia)
 same => n,Hangup()


; ============================================================
; OPCION INVALIDA
; ============================================================

exten => i,1,Playback(custom/opcion-invalida)
 same => n,Set(IVR_ATTEMPTS=$[${IVR_ATTEMPTS}+1])
 same => n,GotoIf($[${IVR_ATTEMPTS} >= 2]?ivr-end,s,1)
 same => n,Goto(ivr-familia,s,1)


; ============================================================
; TIMEOUT
; ============================================================

exten => t,1,Playback(custom/no-seleccion)
 same => n,Set(IVR_ATTEMPTS=$[${IVR_ATTEMPTS}+1])
 same => n,GotoIf($[${IVR_ATTEMPTS} >= 2]?ivr-end,s,1)
 same => n,Goto(ivr-familia,s,1)


; ============================================================
; FIN DEL IVR
; ============================================================

[ivr-end]

exten => s,1,Playback(custom/despedida-familia)
 same => n,Hangup()
