; ============================================================
; REYES SWITCHBOARD
; PJSIP CONFIGURATION
; ============================================================

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060


; ============================================================
; CARLA REYES
; Extension: 3004
; SIP user: carla3004
; ============================================================

[carla3004]
type=endpoint
context=familia-reyes
disallow=all
allow=ulaw,alaw
auth=carla3004-auth
aors=carla3004
callerid="Carla Reyes" <3004>
identify_by=auth_username,username

[carla3004-auth]
type=auth
auth_type=userpass
username=carla3004
password=changeme

[carla3004]
type=aor
max_contacts=1
remove_existing=yes


